name: Build and Release DashX

on:
  push:
    tags:
      - 'V*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies (if needed)
        run: npm install

      - name: Build ZIP for Chrome Extension
        run: |
          rm -f DashX.zip
          zip -r DashX.zip . \
            -x "*.git*" \
            -x "node_modules/*" \
            -x "*.log" \
            -x ".env*" \
            -x ".*" \
            -x "README.md" \
            -x "*.zip"

      - name: Upload ZIP to GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: DashX
          files: DashX.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
